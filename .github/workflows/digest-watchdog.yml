name: Digest Watchdog

# launchd 실행은 실패해도 맥 안에서 아무 흔적을 남기지 않을 수 있어(EX_CONFIG spawn 실패 등)
# 결과물(Notion 페이지)을 바깥에서 확인한다. 실패하면 GitHub가 워크플로 실패 메일을 보낸다.
on:
  schedule:
    - cron: "0 1 * * *"  # 매일 10:00 KST — 07:40 실행분 확인
    - cron: "0 0 1 * *"  # 매월 1일 — keepalive
  workflow_dispatch:

jobs:
  check-digest:
    if: github.event.schedule != '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check today's Notion digest page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          count=$(curl -sSf -X POST "https://api.notion.com/v1/databases/$NOTION_DATABASE_ID/query" \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{\"filter\":{\"property\":\"작성일\",\"date\":{\"equals\":\"$today\"}},\"page_size\":1}" \
            | jq '.results | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::$today 뉴스 큐레이션 페이지가 없습니다. launchd 실행 상태를 확인하세요."
            exit 1
          fi
          echo "$today 페이지 확인됨"

  # public 저장소는 60일간 활동이 없으면 예약 워크플로가 비활성화된다
  keepalive:
    if: github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: 예약 워크플로 비활성화 방지 keepalive"
          git push
